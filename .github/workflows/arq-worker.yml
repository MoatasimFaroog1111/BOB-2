name: arq worker

on:
  push:
    branches: [main]
    paths:
      - "BOB-2/backend/app/worker/**"
      - "BOB-2/backend/tests/test_worker_*.py"
      - "BOB-2/backend/requirements*.txt"
      - "BOB-2/backend/requirements*.lock"
      - "BOB-2/railway*.toml"
      - "BOB-2/Dockerfile"
      - ".github/workflows/arq-worker.yml"
  pull_request:
    branches: [main]
    paths:
      - "BOB-2/backend/app/worker/**"
      - "BOB-2/backend/tests/test_worker_*.py"
      - "BOB-2/backend/requirements*.txt"
      - "BOB-2/backend/requirements*.lock"
      - "BOB-2/railway*.toml"
      - "BOB-2/Dockerfile"
      - ".github/workflows/arq-worker.yml"

permissions:
  contents: read

concurrency:
  group: arq-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-process:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: guardian
          POSTGRES_DB: guardian_worker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian_worker_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: BOB-2/backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://guardian:guardian@127.0.0.1:5432/guardian_worker_test
      REDIS_URL: redis://127.0.0.1:6379/14
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-thirty-two-characters
      SECRET_STORE_PROVIDER: memory
      LOCAL_LLM_ENABLED: "false"
      EXTERNAL_LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BOB-2/backend/requirements.lock
      - name: Install hash-locked dependencies
        run: pip install --quiet --require-hashes -r requirements.lock
      - name: Verify dependency consistency
        run: pip check
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Compile worker package
        run: python -m compileall -q app/worker
      - name: Run worker contract and subprocess tests
        run: python -m pytest tests/test_worker_contract.py tests/test_worker_arq.py -q
