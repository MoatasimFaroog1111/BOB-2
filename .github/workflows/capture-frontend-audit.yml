name: Capture frontend audit diagnostics

on:
  push:
    branches:
      - agent/fix-ci-and-railway

permissions:
  contents: write

jobs:
  capture-audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip audit-capture]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-ci-and-railway
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: BOB-2/frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: BOB-2/frontend
        run: npm ci --ignore-scripts
      - name: Capture audit report
        working-directory: BOB-2/frontend
        run: |
          mkdir -p ../../ci-diagnostics
          npm audit --json > ../../ci-diagnostics/frontend-audit.json || true
          npm audit --audit-level=high > ../../ci-diagnostics/frontend-audit.txt 2>&1 || true
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostics/frontend-audit.json ci-diagnostics/frontend-audit.txt
          git commit -m "ci: capture frontend audit diagnostics [skip audit-capture]"
          git push origin HEAD:agent/fix-ci-and-railway
