name: Capture UTC migration diagnostics

on:
  push:
    branches:
      - agent/fix-ci-and-railway

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[skip utc-capture]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-ci-and-railway
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run migration and capture result
        working-directory: BOB-2/backend
        run: |
          mkdir -p ../../ci-diagnostics
          set +e
          python scripts/replace_datetime_utcnow.py > ../../ci-diagnostics/utc-migration.txt 2>&1
          echo $? > ../../ci-diagnostics/utc-migration-exit-code.txt
          git diff -- app tests > ../../ci-diagnostics/utc-migration.diff
          set -e
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostics
          git commit -m "ci: capture UTC migration diagnostics [skip utc-capture]"
          git push origin HEAD:agent/fix-ci-and-railway
