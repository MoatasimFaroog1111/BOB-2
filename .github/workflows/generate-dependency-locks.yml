name: Generate dependency locks

on:
  pull_request:
    branches: [main]
    paths:
      - "BOB-2/backend/requirements.txt"
      - "BOB-2/backend/requirements.runtime.txt"
      - ".github/workflows/generate-dependency-locks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BOB-2/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # Pin pip to 26.1.2 via setup-python's own bootstrap input so the
          # version is established before any `pip install` step runs.
          # pip 26.2+ changed an internal pip API that pip-tools 7.x still
          # calls without the new required keyword argument; see
          # jazzband/pip-tools#2437 (open as of 2026-08).
          pip-version: "26.1.2"
          cache: pip
      - name: Install pip-tools
        # Install pip-tools into an isolated venv on PATH.
        #
        # Why a venv: any in-process `pip install <pkg>` will treat `pip`
        # itself as a transitive dependency and re-upgrade it to the
        # latest cached release (26.2.x), which crashes pip-compile
        # (jazzband/pip-tools#2437, open as of 2026-08). The system pip
        # stays at 26.1.2.
        #
        # Why --no-deps for pip-tools: pip-tools 7.6.0's setup.py
        # unconditionally pulls `pip` into the install, bypassing the
        # `<26.2` cap. `--no-deps` skips that resolver step. We then
        # install the runtime deps explicitly with the cap in place.
        run: |
          python -m venv /tmp/pip-tools-venv
          /tmp/pip-tools-venv/bin/pip install --upgrade --force-reinstall "pip>=24.2,<26.2"
          /tmp/pip-tools-venv/bin/pip install --no-deps "pip-tools==7.6.0"
          /tmp/pip-tools-venv/bin/pip install --force-reinstall "pip>=24.2,<26.2"
          /tmp/pip-tools-venv/bin/pip install "click>=8.1,<9" "packaging>=24.0" "build>=1.0" "pyproject_hooks" "setuptools" "wheel"
          /tmp/pip-tools-venv/bin/pip --version
          /tmp/pip-tools-venv/bin/pip-compile --version
          echo "/tmp/pip-tools-venv/bin" >> "$GITHUB_PATH"
      - name: Generate hash-locked dependency files
        run: |
          pip-compile --allow-unsafe --generate-hashes --output-file=requirements.lock requirements.txt
          pip-compile --allow-unsafe --generate-hashes --output-file=requirements.runtime.lock requirements.runtime.txt
      - name: Verify clean installs
        run: |
          python -m venv /tmp/guardian-full
          /tmp/guardian-full/bin/pip install --require-hashes -r requirements.lock
          /tmp/guardian-full/bin/pip check
          python -m venv /tmp/guardian-runtime
          /tmp/guardian-runtime/bin/pip install --require-hashes -r requirements.runtime.lock
          /tmp/guardian-runtime/bin/pip check
      - name: Upload generated locks
        uses: actions/upload-artifact@v4
        with:
          name: generated-python-locks
          path: |
            BOB-2/backend/requirements.lock
            BOB-2/backend/requirements.runtime.lock
          if-no-files-found: error
          retention-days: 3
