name: Issue 117 UAT gate

on:
  pull_request:
    paths:
      - "BOB-2/backend/app/api/v1/bank_posting_v2.py"
      - "BOB-2/backend/app/erp/bank_reconciliation.py"
      - "BOB-2/backend/tests/test_bank_posting_idempotency.py"
      - "BOB-2/backend/tests/test_issue_117_uat_gate.py"
      - "BOB-2/release/uat/issue-117/**"
      - ".github/workflows/issue-117-uat-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-acceptance-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: BOB-2/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BOB-2/backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run Issue 117 reconciliation and retry evidence
        run: >-
          pytest -q
          tests/test_issue_117_uat_gate.py
          tests/test_bank_posting_idempotency.py
