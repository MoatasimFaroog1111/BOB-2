name: Refresh frontend security lock

on:
  push:
    branches:
      - agent/fix-ci-and-railway

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[skip lock-refresh]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BOB-2/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-ci-and-railway
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: BOB-2/frontend/package-lock.json
      - name: Refresh secure dependency versions
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@16.2.11 sharp@0.35.3
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-config-next@16.2.11
      - name: Commit refreshed package manifest and lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(frontend): refresh secure dependency lock [skip lock-refresh]"
          git push origin HEAD:agent/fix-ci-and-railway
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
        run: npm run build
