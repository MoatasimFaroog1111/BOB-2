name: T4 Generate Locks

on:
  push:
    branches:
      - agent/t4-arq-worker
    paths:
      - "BOB-2/backend/requirements.txt"
      - "BOB-2/backend/requirements.runtime.txt"
      - ".github/workflows/t4-generate-locks.yml"
  pull_request:
    branches: [main]
    paths:
      - "BOB-2/backend/requirements.txt"
      - "BOB-2/backend/requirements.runtime.txt"
      - ".github/workflows/t4-generate-locks.yml"

permissions:
  contents: read

concurrency:
  group: t4-generate-locks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pip-tools
        run: python -m pip install --disable-pip-version-check pip-tools==7.6.0
      - name: Compile hash-locked dependency files
        working-directory: BOB-2/backend
        run: |
          pip-compile --allow-unsafe --generate-hashes --output-file=requirements.lock requirements.txt
          pip-compile --allow-unsafe --generate-hashes --output-file=requirements.runtime.lock requirements.runtime.txt
      - uses: actions/upload-artifact@v4
        with:
          name: t4-requirement-locks
          path: |
            BOB-2/backend/requirements.lock
            BOB-2/backend/requirements.runtime.lock
          if-no-files-found: error
          retention-days: 1
