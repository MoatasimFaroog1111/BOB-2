name: Temporary inspect production ClamAV

on:
  push:
    branches:
      - agent/railway-clamav-release-gate
    paths:
      - .github/workflows/temp-clamav-status.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: db1f1265-1590-4bf0-8c1a-884c2806e0b9
      ENVIRONMENT_ID: 3caf3125-f1c7-4817-bb04-eb7ad772fc4a
      BACKEND_SERVICE_ID: e253a8c9-06d8-4f11-8c54-f300162796ee
    steps:
      - name: Inspect Railway configuration
        id: inspect
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +e
          api() {
            curl --silent --show-error \
              --request POST \
              --url https://backboard.railway.com/graphql/v2 \
              --header "Project-Access-Token: $RAILWAY_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$1"
          }

          services_payload=$(jq -n --arg projectId "$PROJECT_ID" '{query:"query project($projectId: String!) { project(id: $projectId) { services { edges { node { id name } } } } }",variables:{projectId:$projectId}}')
          services_response=$(api "$services_payload")
          clamav_id=$(echo "$services_response" | jq -r '.data.project.services.edges[].node | select((.name | ascii_downcase) == "clamav") | .id' | head -n 1)

          variables_payload=$(jq -n --arg projectId "$PROJECT_ID" --arg environmentId "$ENVIRONMENT_ID" --arg serviceId "$BACKEND_SERVICE_ID" '{query:"query variables($projectId: String!, $environmentId: String!, $serviceId: String) { variables(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId) }",variables:{projectId:$projectId,environmentId:$environmentId,serviceId:$serviceId}}')
          variables_response=$(api "$variables_payload")

          service_exists=false
          variables_match=false
          api_ok=true
          deployment_status=NOT_FOUND
          if test -n "$clamav_id"; then
            service_exists=true
            echo "::add-mask::$clamav_id"
            deployments_payload=$(jq -n \
              --arg projectId "$PROJECT_ID" \
              --arg serviceId "$clamav_id" \
              --arg environmentId "$ENVIRONMENT_ID" \
              '{query:"query deployments($input: DeploymentListInput!) { deployments(input: $input, first: 5) { edges { node { status createdAt } } } }",variables:{input:{projectId:$projectId,serviceId:$serviceId,environmentId:$environmentId}}}')
            deployments_response=$(api "$deployments_payload")
            deployment_status=$(echo "$deployments_response" | jq -r '.data.deployments.edges[0].node.status // "NOT_FOUND"' | tr '[:lower:]' '[:upper:]')
            if echo "$deployments_response" | jq -e '.errors and (.errors | length > 0)' >/dev/null 2>&1; then api_ok=false; deployment_status=QUERY_ERROR; fi
          fi

          require_scan=$(echo "$variables_response" | jq -r '.data.variables.REQUIRE_MALWARE_SCAN // empty')
          clamav_host=$(echo "$variables_response" | jq -r '.data.variables.CLAMAV_HOST // empty')
          clamav_port=$(echo "$variables_response" | jq -r '.data.variables.CLAMAV_PORT // empty')
          if test "$require_scan" = "true" && test "$clamav_host" = "clamav.railway.internal" && test "$clamav_port" = "3310"; then variables_match=true; fi
          if echo "$services_response$variables_response" | jq -e '.errors and (.errors | length > 0)' >/dev/null 2>&1; then api_ok=false; fi

          echo "service_exists=$service_exists" >> "$GITHUB_OUTPUT"
          echo "deployment_status=$deployment_status" >> "$GITHUB_OUTPUT"
          echo "variables_match=$variables_match" >> "$GITHUB_OUTPUT"
          echo "api_ok=$api_ok" >> "$GITHUB_OUTPUT"

      - name: Report sanitized status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE_EXISTS: ${{ steps.inspect.outputs.service_exists }}
          DEPLOYMENT_STATUS: ${{ steps.inspect.outputs.deployment_status }}
          VARIABLES_MATCH: ${{ steps.inspect.outputs.variables_match }}
          API_OK: ${{ steps.inspect.outputs.api_ok }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/140/comments" \
            --field body="Railway ClamAV status check: API accessible=\`${API_OK:-false}\`; private service present=\`${SERVICE_EXISTS:-false}\`; latest ClamAV deployment=\`${DEPLOYMENT_STATUS:-unknown}\`; backend scanner variables match=\`${VARIABLES_MATCH:-false}\`. Identifiers and secrets are omitted." >/dev/null
