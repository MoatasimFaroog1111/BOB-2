name: Temporary configure production ClamAV backend

on:
  push:
    branches:
      - agent/railway-clamav-release-gate
    paths:
      - .github/workflows/temp-configure-clamav-backend.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROJECT_ID: db1f1265-1590-4bf0-8c1a-884c2806e0b9
      ENVIRONMENT_ID: 3caf3125-f1c7-4817-bb04-eb7ad772fc4a
      BACKEND_SERVICE_ID: e253a8c9-06d8-4f11-8c54-f300162796ee
      BACKEND_URL: https://bob-2-production.up.railway.app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest

      - name: Verify ClamAV, configure backend, and redeploy
        id: configure
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail

          railway_api() {
            local response
            response=$(curl --fail-with-body --silent --show-error \
              --request POST \
              --url https://backboard.railway.com/graphql/v2 \
              --header "Project-Access-Token: $RAILWAY_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$1")
            if echo "$response" | jq -e '.errors and (.errors | length > 0)' >/dev/null; then
              echo "$response" | jq '{errors}'
              return 1
            fi
            printf '%s' "$response"
          }

          services_payload=$(jq -n --arg projectId "$PROJECT_ID" \
            '{query:"query project($projectId: String!) { project(id: $projectId) { services { edges { node { id name } } } } }",variables:{projectId:$projectId}}')
          services_response=$(railway_api "$services_payload")
          clamav_service_id=$(echo "$services_response" | jq -r \
            '.data.project.services.edges[].node | select((.name | ascii_downcase) == "clamav") | .id' | head -n 1)
          test -n "$clamav_service_id"
          echo "::add-mask::$clamav_service_id"

          redeploy_clamav_payload=$(jq -n \
            --arg environmentId "$ENVIRONMENT_ID" \
            --arg serviceId "$clamav_service_id" \
            '{query:"mutation serviceInstanceRedeploy($environmentId: String!, $serviceId: String!) { serviceInstanceRedeploy(environmentId: $environmentId, serviceId: $serviceId) }",variables:{environmentId:$environmentId,serviceId:$serviceId}}')
          railway_api "$redeploy_clamav_payload" >/dev/null || true

          clamav_status="UNKNOWN"
          for attempt in $(seq 1 120); do
            railway deployment list --service "$clamav_service_id" --environment "$ENVIRONMENT_ID" --limit 1 --json > /tmp/clamav.json 2>/tmp/clamav.err || true
            clamav_status=$(jq -r 'if type == "array" then (.[0].status // "UNKNOWN") else (.deployments[0].status // .status // "UNKNOWN") end' /tmp/clamav.json 2>/dev/null | tr '[:lower:]' '[:upper:]')
            case "$clamav_status" in
              SUCCESS) break ;;
              FAILED|CRASHED|REMOVED)
                railway logs --service "$clamav_service_id" --environment "$ENVIRONMENT_ID" --latest --lines 120 || true
                exit 1
                ;;
            esac
            sleep 10
          done
          test "$clamav_status" = "SUCCESS"

          upsert() {
            local name="$1" value="$2"
            local payload
            payload=$(jq -n \
              --arg projectId "$PROJECT_ID" \
              --arg environmentId "$ENVIRONMENT_ID" \
              --arg serviceId "$BACKEND_SERVICE_ID" \
              --arg name "$name" \
              --arg value "$value" \
              '{query:"mutation variableUpsert($input: VariableUpsertInput!) { variableUpsert(input: $input) }",variables:{input:{projectId:$projectId,environmentId:$environmentId,serviceId:$serviceId,name:$name,value:$value}}}')
            railway_api "$payload" >/dev/null
          }

          upsert REQUIRE_MALWARE_SCAN true
          upsert CLAMAV_HOST clamav.railway.internal
          upsert CLAMAV_PORT 3310

          variables_payload=$(jq -n \
            --arg projectId "$PROJECT_ID" \
            --arg environmentId "$ENVIRONMENT_ID" \
            --arg serviceId "$BACKEND_SERVICE_ID" \
            '{query:"query variables($projectId: String!, $environmentId: String!, $serviceId: String) { variables(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId) }",variables:{projectId:$projectId,environmentId:$environmentId,serviceId:$serviceId}}')
          variables_response=$(railway_api "$variables_payload")
          test "$(echo "$variables_response" | jq -r '.data.variables.REQUIRE_MALWARE_SCAN // empty')" = true
          test "$(echo "$variables_response" | jq -r '.data.variables.CLAMAV_HOST // empty')" = clamav.railway.internal
          test "$(echo "$variables_response" | jq -r '.data.variables.CLAMAV_PORT // empty')" = 3310

          backend_redeploy_payload=$(jq -n \
            --arg environmentId "$ENVIRONMENT_ID" \
            --arg serviceId "$BACKEND_SERVICE_ID" \
            '{query:"mutation serviceInstanceRedeploy($environmentId: String!, $serviceId: String!) { serviceInstanceRedeploy(environmentId: $environmentId, serviceId: $serviceId) }",variables:{environmentId:$environmentId,serviceId:$serviceId}}')
          railway_api "$backend_redeploy_payload" >/dev/null

          backend_status="UNKNOWN"
          for attempt in $(seq 1 90); do
            railway deployment list --service "$BACKEND_SERVICE_ID" --environment "$ENVIRONMENT_ID" --limit 1 --json > /tmp/backend.json
            backend_status=$(jq -r 'if type == "array" then (.[0].status // "UNKNOWN") else (.deployments[0].status // .status // "UNKNOWN") end' /tmp/backend.json | tr '[:lower:]' '[:upper:]')
            case "$backend_status" in
              SUCCESS) break ;;
              FAILED|CRASHED|REMOVED)
                railway logs --service "$BACKEND_SERVICE_ID" --environment "$ENVIRONMENT_ID" --latest --lines 120 || true
                exit 1
                ;;
            esac
            sleep 10
          done
          test "$backend_status" = SUCCESS

          curl --fail --silent --show-error --max-time 30 "$BACKEND_URL/health" | jq -e '.status == "healthy"' >/dev/null
          curl --fail --silent --show-error --max-time 30 "$BACKEND_URL/ready" | jq -e '.status == "ready"' >/dev/null

      - name: Report sanitized success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/140/comments" \
            --field body='Production ClamAV is deployed privately. The mandatory backend scanner variables now match the approved values, the backend redeployed successfully, and both liveness and readiness checks passed. Identifiers and secrets are omitted.' >/dev/null

      - name: Report sanitized failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/140/comments" \
            --field body='Production ClamAV configuration did not complete. PR #140 remains a draft and was not merged. Review the temporary workflow run logs before retrying; no secret values were posted.' >/dev/null
