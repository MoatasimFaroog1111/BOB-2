name: Temporary production login inspection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-inspect-production-login.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Inspect account without exposing secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PROJECT_ID: db1f1265-1590-4bf0-8c1a-884c2806e0b9
          ENVIRONMENT_ID: 3caf3125-f1c7-4817-bb04-eb7ad772fc4a
          LOGIN_EMAIL: motasim.noor@gtc-intl.com
        run: |
          set -euo pipefail

          services_payload=$(jq -n \
            --arg projectId "$PROJECT_ID" \
            '{query:"query project($projectId: String!) { project(id: $projectId) { services { edges { node { id name } } } } }",variables:{projectId:$projectId}}')
          services_response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$services_payload")
          if echo "$services_response" | jq -e '.errors and (.errors | length > 0)' >/dev/null; then
            echo "$services_response" | jq '{errors}'
            exit 1
          fi

          postgres_service_id=$(echo "$services_response" | jq -r '
            .data.project.services.edges[].node
            | select((.name | ascii_downcase) | contains("postgres"))
            | .id' | head -n 1)
          test -n "$postgres_service_id"

          variables_payload=$(jq -n \
            --arg projectId "$PROJECT_ID" \
            --arg environmentId "$ENVIRONMENT_ID" \
            --arg serviceId "$postgres_service_id" \
            '{query:"query variables($projectId: String!, $environmentId: String!, $serviceId: String) { variables(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId) }",variables:{projectId:$projectId,environmentId:$environmentId,serviceId:$serviceId}}')
          variables_response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$variables_payload")
          if echo "$variables_response" | jq -e '.errors and (.errors | length > 0)' >/dev/null; then
            echo "$variables_response" | jq '{errors}'
            exit 1
          fi

          DATABASE_PUBLIC_URL=$(echo "$variables_response" | jq -r '.data.variables.DATABASE_PUBLIC_URL // .data.variables.POSTGRES_PUBLIC_URL // empty')
          test -n "$DATABASE_PUBLIC_URL"
          echo "::add-mask::$DATABASE_PUBLIC_URL"
          export DATABASE_PUBLIC_URL

          python -m pip install --quiet psycopg2-binary

          python - <<'PY' > /tmp/login-result.json
          import json
          import os
          import psycopg2

          email = os.environ["LOGIN_EMAIL"].strip().lower()
          conn = psycopg2.connect(os.environ["DATABASE_PUBLIC_URL"], connect_timeout=15)
          try:
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      SELECT u.id, u.email, u.full_name, u.role, u.is_active,
                             u.organization_id, u.security_version,
                             o.is_active AS organization_active,
                             u.hashed_password
                      FROM users AS u
                      LEFT JOIN organizations AS o ON o.id = u.organization_id
                      WHERE lower(u.email) = %s
                      ORDER BY u.id
                      """,
                      (email,),
                  )
                  rows = cur.fetchall()
          finally:
              conn.close()

          result = {"requested_email": email, "matching_accounts": len(rows)}
          if rows:
              row = rows[0]
              stored_email = row[1]
              password_hash = row[8] or ""
              result.update(
                  {
                      "user_id": row[0],
                      "stored_email": stored_email,
                      "email_is_exact_lowercase": stored_email == email,
                      "full_name": row[2],
                      "role": row[3],
                      "user_active": bool(row[4]),
                      "organization_id": row[5],
                      "security_version": row[6],
                      "organization_active": bool(row[7]) if row[7] is not None else False,
                      "password_hash_present": bool(password_hash),
                      "password_hash_is_bcrypt": password_hash.startswith(("$2a$", "$2b$", "$2y$")),
                      "password_hash_length": len(password_hash),
                  }
              )
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY

          cat /tmp/login-result.json
          {
            printf '## Production login account inspection\n\n'
            printf '```json\n'
            cat /tmp/login-result.json
            printf '\n```\n'
          } > /tmp/login-comment.md
          gh pr comment 134 --body-file /tmp/login-comment.md
