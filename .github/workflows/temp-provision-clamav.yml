name: Temporary provision production ClamAV

on:
  push:
    branches:
      - agent/railway-clamav-release-gate
    paths:
      - .github/workflows/temp-provision-clamav.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  provision-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: db1f1265-1590-4bf0-8c1a-884c2806e0b9
      ENVIRONMENT_ID: 3caf3125-f1c7-4817-bb04-eb7ad772fc4a
      BACKEND_SERVICE_ID: e253a8c9-06d8-4f11-8c54-f300162796ee
      BACKEND_URL: https://bob-2-production.up.railway.app
      CLAMAV_SERVICE_NAME: clamav
      CLAMAV_IMAGE: clamav/clamav:stable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest

      - name: Provision private ClamAV and configure backend
        id: provision
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          railway_api() {
            local payload="$1"
            local response
            response=$(curl --fail-with-body --silent --show-error \
              --request POST \
              --url https://backboard.railway.com/graphql/v2 \
              --header "Project-Access-Token: $RAILWAY_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$payload")
            if echo "$response" | jq -e '.errors and (.errors | length > 0)' >/dev/null; then
              echo "$response" | jq '{errors}'
              return 1
            fi
            printf '%s' "$response"
          }

          services_payload=$(jq -n \
            --arg projectId "$PROJECT_ID" \
            '{query:"query project($projectId: String!) { project(id: $projectId) { services { edges { node { id name } } } } }",variables:{projectId:$projectId}}')
          services_response=$(railway_api "$services_payload")
          clamav_service_id=$(echo "$services_response" | jq -r \
            --arg name "$CLAMAV_SERVICE_NAME" \
            '.data.project.services.edges[].node | select((.name | ascii_downcase) == ($name | ascii_downcase)) | .id' | head -n 1)

          if test -z "$clamav_service_id"; then
            create_payload=$(jq -n \
              --arg projectId "$PROJECT_ID" \
              --arg name "$CLAMAV_SERVICE_NAME" \
              --arg image "$CLAMAV_IMAGE" \
              '{query:"mutation createService($input: ServiceCreateInput!) { serviceCreate(input: $input) { id name } }",variables:{input:{projectId:$projectId,name:$name,source:{image:$image}}}}')
            create_response=$(railway_api "$create_payload")
            clamav_service_id=$(echo "$create_response" | jq -r '.data.serviceCreate.id // empty')
            test -n "$clamav_service_id"
            echo "Created private ClamAV service."
          else
            echo "Reusing existing private ClamAV service."
          fi
          echo "::add-mask::$clamav_service_id"
          echo "clamav_service_id=$clamav_service_id" >> "$GITHUB_OUTPUT"

          redeploy_clamav_payload=$(jq -n \
            --arg environmentId "$ENVIRONMENT_ID" \
            --arg serviceId "$clamav_service_id" \
            '{query:"mutation serviceInstanceRedeploy($environmentId: String!, $serviceId: String!) { serviceInstanceRedeploy(environmentId: $environmentId, serviceId: $serviceId) }",variables:{environmentId:$environmentId,serviceId:$serviceId}}')
          railway_api "$redeploy_clamav_payload" >/dev/null || true

          clamav_status="UNKNOWN"
          for attempt in $(seq 1 90); do
            railway deployment list \
              --service "$clamav_service_id" \
              --environment "$ENVIRONMENT_ID" \
              --limit 1 \
              --json > /tmp/clamav-deployment.json 2>/tmp/clamav-cli.err || true
            clamav_status=$(jq -r \
              'if type == "array" then (.[0].status // "UNKNOWN") else (.deployments[0].status // .status // "UNKNOWN") end' \
              /tmp/clamav-deployment.json 2>/dev/null | tr '[:lower:]' '[:upper:]')
            case "$clamav_status" in
              SUCCESS) break ;;
              FAILED|CRASHED|REMOVED)
                cat /tmp/clamav-cli.err || true
                railway logs --service "$clamav_service_id" --environment "$ENVIRONMENT_ID" --latest --lines 200 || true
                echo "ClamAV deployment ended with $clamav_status"
                exit 1
                ;;
            esac
            sleep 10
          done
          test "$clamav_status" = "SUCCESS"

          upsert_variable() {
            local name="$1"
            local value="$2"
            local payload
            payload=$(jq -n \
              --arg projectId "$PROJECT_ID" \
              --arg environmentId "$ENVIRONMENT_ID" \
              --arg serviceId "$BACKEND_SERVICE_ID" \
              --arg name "$name" \
              --arg value "$value" \
              '{query:"mutation variableUpsert($input: VariableUpsertInput!) { variableUpsert(input: $input) }",variables:{input:{projectId:$projectId,environmentId:$environmentId,serviceId:$serviceId,name:$name,value:$value}}}')
            railway_api "$payload" >/dev/null
          }

          upsert_variable REQUIRE_MALWARE_SCAN true
          upsert_variable CLAMAV_HOST "${CLAMAV_SERVICE_NAME}.railway.internal"
          upsert_variable CLAMAV_PORT 3310

          backend_redeploy_payload=$(jq -n \
            --arg environmentId "$ENVIRONMENT_ID" \
            --arg serviceId "$BACKEND_SERVICE_ID" \
            '{query:"mutation serviceInstanceRedeploy($environmentId: String!, $serviceId: String!) { serviceInstanceRedeploy(environmentId: $environmentId, serviceId: $serviceId) }",variables:{environmentId:$environmentId,serviceId:$serviceId}}')
          railway_api "$backend_redeploy_payload" >/dev/null

          backend_status="UNKNOWN"
          for attempt in $(seq 1 90); do
            railway deployment list \
              --service "$BACKEND_SERVICE_ID" \
              --environment "$ENVIRONMENT_ID" \
              --limit 1 \
              --json > /tmp/backend-deployment.json
            backend_status=$(jq -r \
              'if type == "array" then (.[0].status // "UNKNOWN") else (.deployments[0].status // .status // "UNKNOWN") end' \
              /tmp/backend-deployment.json | tr '[:lower:]' '[:upper:]')
            case "$backend_status" in
              SUCCESS) break ;;
              FAILED|CRASHED|REMOVED)
                railway logs --service "$BACKEND_SERVICE_ID" --environment "$ENVIRONMENT_ID" --latest --lines 200 || true
                echo "Backend deployment ended with $backend_status"
                exit 1
                ;;
            esac
            sleep 10
          done
          test "$backend_status" = "SUCCESS"

          health=$(curl --fail --silent --show-error --max-time 30 "$BACKEND_URL/health")
          echo "$health" | jq -e '.status == "healthy"' >/dev/null
          readiness=$(curl --fail --silent --show-error --max-time 30 "$BACKEND_URL/ready")
          echo "$readiness" | jq -e '.status == "ready"' >/dev/null

          variables_payload=$(jq -n \
            --arg projectId "$PROJECT_ID" \
            --arg environmentId "$ENVIRONMENT_ID" \
            --arg serviceId "$BACKEND_SERVICE_ID" \
            '{query:"query variables($projectId: String!, $environmentId: String!, $serviceId: String) { variables(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId) }",variables:{projectId:$projectId,environmentId:$environmentId,serviceId:$serviceId}}')
          variables_response=$(railway_api "$variables_payload")
          test "$(echo "$variables_response" | jq -r '.data.variables.REQUIRE_MALWARE_SCAN // empty')" = "true"
          test "$(echo "$variables_response" | jq -r '.data.variables.CLAMAV_HOST // empty')" = "${CLAMAV_SERVICE_NAME}.railway.internal"
          test "$(echo "$variables_response" | jq -r '.data.variables.CLAMAV_PORT // empty')" = "3310"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/140/comments" \
            --field body="Production ClamAV provisioning completed: private service deployed successfully, backend scanner variables were applied, backend redeployment succeeded, and both /health and /ready returned healthy results. Service identifiers and secrets were intentionally omitted. PR remains unmerged pending the final release-gate deployment." >/dev/null
