name: Temporary Railway PR verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/railway-repair-trigger"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --global @railway/cli@latest
      - name: Verify Railway backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PROJECT_ID: db1f1265-1590-4bf0-8c1a-884c2806e0b9
          ENVIRONMENT_ID: 3caf3125-f1c7-4817-bb04-eb7ad772fc4a
          SERVICE_ID: e253a8c9-06d8-4f11-8c54-f300162796ee
        run: |
          set +e
          mkdir -p /tmp/railway-check
          report=/tmp/railway-check/report.md
          printf '## Railway production verification\n\n' > "$report"

          railway link --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --service "$SERVICE_ID" --json \
            > /tmp/railway-check/link.json 2> /tmp/railway-check/link.err
          link_code=$?
          printf -- '- Link exit code: `%s`\n' "$link_code" >> "$report"

          railway deployment list --service "$SERVICE_ID" --environment "$ENVIRONMENT_ID" --limit 1 --json \
            > /tmp/railway-check/latest.json 2> /tmp/railway-check/latest.err
          deployment_code=$?

          readarray -t parsed < <(python - <<'PY'
import json
from pathlib import Path
try:
    data = json.loads(Path('/tmp/railway-check/latest.json').read_text())
except Exception:
    print('UNKNOWN'); print(''); raise SystemExit
rows = data if isinstance(data, list) else data.get('deployments', [])
row = rows[0] if rows else {}
print(str(row.get('status', 'UNKNOWN')).upper())
print(str(row.get('id', '')))
PY
)
          latest_status="${parsed[0]:-UNKNOWN}"
          latest_id="${parsed[1]:-}"
          printf -- '- Latest deployment status: `%s`\n' "$latest_status" >> "$report"
          printf -- '- Latest deployment ID: `%s`\n' "$latest_id" >> "$report"

          railway domain --service "$SERVICE_ID" --json \
            > /tmp/railway-check/domain.json 2> /tmp/railway-check/domain.err
          domain_code=$?

          domain=$(python - <<'PY'
import re
from pathlib import Path
text = ''
for name in ('domain.json','domain.err'):
    path = Path('/tmp/railway-check') / name
    if path.exists():
        text += '\n' + path.read_text(errors='ignore')
match = re.search(r'([a-zA-Z0-9-]+\.up\.railway\.app)', text)
print(match.group(1) if match else '')
PY
)

          if [ -z "$domain" ]; then
            railway run --service "$SERVICE_ID" -- sh -lc 'printf "%s" "$RAILWAY_PUBLIC_DOMAIN"' \
              > /tmp/railway-check/public-domain.txt 2> /tmp/railway-check/public-domain.err
            domain=$(grep -Eo '[a-zA-Z0-9-]+\.up\.railway\.app' /tmp/railway-check/public-domain.txt | head -n 1)
          fi

          printf -- '- Domain command exit code: `%s`\n' "$domain_code" >> "$report"
          printf -- '- Public domain: `%s`\n' "${domain:-not-resolved}" >> "$report"

          health_code=000
          if [ -n "$domain" ]; then
            for attempt in $(seq 1 30); do
              health_code=$(curl --silent --show-error --location --max-time 20 \
                --output /tmp/railway-check/health.txt --write-out '%{http_code}' "https://${domain}/health")
              [ "$health_code" = 200 ] && break
              sleep 10
            done
          fi
          printf -- '- Health status: `%s`\n\n' "$health_code" >> "$report"
          if [ -s /tmp/railway-check/health.txt ]; then
            printf '```json\n%s\n```\n' "$(head -c 1000 /tmp/railway-check/health.txt)" >> "$report"
          fi

          if [ "$link_code" = 0 ] && [ "$deployment_code" = 0 ] && [ "$latest_status" = SUCCESS ] && [ "$health_code" = 200 ]; then
            printf '\n**Result:** Railway backend is deployed and healthy.\n' >> "$report"
            final=0
          else
            printf '\n**Result:** Verification did not fully pass.\n\n```text\n' >> "$report"
            for file in /tmp/railway-check/*.err; do
              [ -s "$file" ] || continue
              printf '\n--- %s ---\n' "$(basename "$file")" >> "$report"
              sed -E 's/(token|authorization|bearer)[^ ]*/[REDACTED]/Ig' "$file" | tail -n 20 >> "$report"
            done
            printf '\n```\n' >> "$report"
            final=1
          fi

          gh pr comment 134 --body-file "$report"
          exit "$final"
