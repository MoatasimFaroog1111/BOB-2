name: Inspect Railway production service

on:
  push:
    branches:
      - agent/fix-ci-and-railway

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip railway-inspect]') }}
    runs-on: ubuntu-latest
    env:
      PROJECT_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      ACCOUNT_RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-ci-and-railway
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Inspect linked Railway project safely
        run: |
          rm -rf ci-diagnostics
          mkdir -p ci-diagnostics
          [ -n "$PROJECT_RAILWAY_TOKEN" ] && echo yes || echo no > ci-diagnostics/project-token-present.txt
          [ -n "$ACCOUNT_RAILWAY_TOKEN" ] && echo yes || echo no > ci-diagnostics/account-token-present.txt
          npm install --global @railway/cli

          linked=0
          if [ -n "$PROJECT_RAILWAY_TOKEN" ]; then
            export RAILWAY_TOKEN="$PROJECT_RAILWAY_TOKEN"
            unset RAILWAY_API_TOKEN
            if railway link --project db1f1265-1590-4bf0-8c1a-884c2806e0b9 --environment 3caf3125-f1c7-4817-bb04-eb7ad772fc4a --service e253a8c9-06d8-4f11-8c54-f300162796ee --json > ci-diagnostics/project-link.json 2> ci-diagnostics/project-link-error.txt; then
              echo project-token > ci-diagnostics/railway-auth-source.txt
              linked=1
            fi
          fi

          if [ "$linked" = 0 ] && [ -n "$ACCOUNT_RAILWAY_TOKEN" ]; then
            unset RAILWAY_TOKEN
            export RAILWAY_API_TOKEN="$ACCOUNT_RAILWAY_TOKEN"
            if railway link --project db1f1265-1590-4bf0-8c1a-884c2806e0b9 --environment 3caf3125-f1c7-4817-bb04-eb7ad772fc4a --service e253a8c9-06d8-4f11-8c54-f300162796ee --json > ci-diagnostics/account-link.json 2> ci-diagnostics/account-link-error.txt; then
              echo account-token > ci-diagnostics/railway-auth-source.txt
              linked=1
            fi
          fi

          if [ "$linked" = 0 ]; then
            echo none-valid > ci-diagnostics/railway-auth-source.txt
            exit 0
          fi

          set +e
          railway status --json > ci-diagnostics/railway-status.json 2> ci-diagnostics/railway-status-error.txt
          echo $? > ci-diagnostics/railway-status-exit.txt
          railway service status --all > ci-diagnostics/railway-services.txt 2> ci-diagnostics/railway-services-error.txt
          echo $? > ci-diagnostics/railway-services-exit.txt
          railway deployment list --service e253a8c9-06d8-4f11-8c54-f300162796ee --environment 3caf3125-f1c7-4817-bb04-eb7ad772fc4a --limit 10 --json > ci-diagnostics/railway-deployments.json 2> ci-diagnostics/railway-deployments-error.txt
          echo $? > ci-diagnostics/railway-deployments-exit.txt
          set -e
      - name: Commit inspection evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ci-diagnostics
          git commit -m "ci: inspect Railway authentication [skip railway-inspect]"
          git push origin HEAD:agent/fix-ci-and-railway
