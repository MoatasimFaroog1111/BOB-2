name: Inspect Railway production service

on:
  push:
    branches:
      - agent/fix-ci-and-railway

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip railway-inspect]') }}
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-ci-and-railway
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Inspect linked Railway project safely
        run: |
          rm -rf ci-diagnostics
          mkdir -p ci-diagnostics
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo project-token > ci-diagnostics/railway-auth-source.txt
          elif [ -n "$RAILWAY_API_TOKEN" ]; then
            echo account-token > ci-diagnostics/railway-auth-source.txt
          else
            echo none > ci-diagnostics/railway-auth-source.txt
            exit 0
          fi
          npm install --global @railway/cli
          set +e
          railway link \
            --project db1f1265-1590-4bf0-8c1a-884c2806e0b9 \
            --environment 3caf3125-f1c7-4817-bb04-eb7ad772fc4a \
            --service e253a8c9-06d8-4f11-8c54-f300162796ee \
            --json > ci-diagnostics/railway-link.json 2> ci-diagnostics/railway-link-error.txt
          echo $? > ci-diagnostics/railway-link-exit.txt
          railway status --json > ci-diagnostics/railway-status.json 2> ci-diagnostics/railway-status-error.txt
          echo $? > ci-diagnostics/railway-status-exit.txt
          railway service status --all > ci-diagnostics/railway-services.txt 2> ci-diagnostics/railway-services-error.txt
          echo $? > ci-diagnostics/railway-services-exit.txt
          railway deployment list \
            --service e253a8c9-06d8-4f11-8c54-f300162796ee \
            --environment 3caf3125-f1c7-4817-bb04-eb7ad772fc4a \
            --limit 10 --json > ci-diagnostics/railway-deployments.json 2> ci-diagnostics/railway-deployments-error.txt
          echo $? > ci-diagnostics/railway-deployments-exit.txt
          set -e
      - name: Commit inspection evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ci-diagnostics
          git commit -m "ci: inspect Railway service [skip railway-inspect]"
          git push origin HEAD:agent/fix-ci-and-railway
