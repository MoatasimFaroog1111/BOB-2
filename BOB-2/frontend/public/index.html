<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساحة العمل - الروبوت المحاسبي</title>
    <!-- ربط ملف التصميم -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>الروبوت المحاسبي BOB-2</h1>
            <p>مساحة العمل: تقارير ولوحات البيانات ستعرض هنا</p>
        </header>
        
        <main class="chat-box" id="chatBox">
            <!-- ستظهر الرسائل هنا -->
            <div class="message bot-message">مرحباً بك. أنا جاهز لتلقي الأوامر المحاسبية والملفات.</div>
        </main>

        <footer class="chat-input-area">
            <!-- زر إرفاق الملفات -->
            <input type="file" id="fileInput" class="file-input" title="إرفاق ملف">
            <!-- مربع النص -->
            <input type="text" id="messageInput" placeholder="اكتب أمرك المحاسبي هنا..." autofocus>
            <!-- زر الإرسال بدون أي أكواد مضمنة -->
            <button id="sendBtn">إرسال</button>
        </footer>
    </div>

    <!-- ربط ملف الجافاسكربت -->
    <script src="script.js"></script>
</body>
</html>
