# Railway applies Config-as-Code per service. The web service uses this file;
# the separate background worker service uses /railway.worker.toml and shares
# the same Dockerfile image with a different start command.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "python -m app.predeploy"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
