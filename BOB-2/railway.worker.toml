# Create a second Railway service from this repository and set its custom
# Config-as-Code path to /railway.worker.toml. Railway applies one config file
# per service: the web service uses /railway.toml, while this worker service
# shares the same image and DATABASE_URL/REDIS_URL/storage/security variables
# but starts arq instead of Uvicorn.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "python -m app.predeploy"
startCommand = "/usr/local/bin/guardian-entrypoint arq app.worker.settings.WorkerSettings"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
